[project]
name = "sumunjang"
version = "0.1.0"
description = "AI API 경계에서 한국 개인정보를 막는 로컬 게이트웨이 — base_url 한 줄로 붙이는 온디바이스 마스킹 프록시"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "문지기 (sumunjang)" }]
keywords = ["pii", "privacy", "korean", "llm", "proxy", "masking", "개인정보", "가명처리"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Korean",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

# 런타임 의존성은 프록시 계층에만 필요하다.
# 탐지·마스킹 코어(detect/mask)는 표준 라이브러리만 사용한다 — 개인정보가 지나가는
# 경로에 서드파티 코드를 두지 않기 위한 의도적 설계 (공급망 공격 표면 최소화).
dependencies = [
    "httpx>=0.27",   # 업스트림 API 호출
    "uvicorn>=0.30",  # ASGI 서버 (앱은 순수 ASGI로 직접 구현, 웹 프레임워크 없음)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
sumunjang = "sumunjang.cli:main"

[project.urls]
Homepage = "https://github.com/HaChanho/sumunjang"
Repository = "https://github.com/HaChanho/sumunjang"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sumunjang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
